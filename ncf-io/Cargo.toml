[package]
name = "ncf-io"
version = "0.1.0"
edition = "2021"

[dependencies]
blake3 = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ncf-core = { path = "../ncf-core" }
memmap2 = "0.9"
bytes = "1.4"
crossbeam = "0.8"
libc = "0.2"
zstd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
ciborium = { version = "0.2", features = ["std"] }
thiserror = "1.0"
self_cell = "1.2.2"
once_cell = "1.21"

[dev-dependencies]
criterion = { workspace = true }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.7"
safetensors = "0.7"
tempfile = "3"

[[bench]]
name = "ncf_performance"
harness = false
path = "benches/ncf_performance.rs"
